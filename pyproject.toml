[project]
name = "neural-sde"
version = "0.1.0"
description = "Command line tool to apply the Neural SDE framework to any time series data."
readme = "README.md"
requires-python = ">=3.13.3"
dependencies = [
    "marimo>=0.14.13",
    "matplotlib>=3.10.3",
    "numpy>=2.3.1",
    "openai>=1.106.1",
    "pdoc>=15.0.4",
    "pre-commit>=4.3.0",
    "pyrefly>=0.24.2",
    "pytest>=8.4.1",
    "pyyaml>=6.0.2",
    "ruff>=0.12.3",
    "scipy>=1.16.1",
    "torch>=2.7.1",
    "tqdm>=4.67.1",
    "wandb>=0.18.0",
    "zarr>=3.1.0",
    "pandas>=2.2.0",
]

[dependency-groups]
docs = [
    "pdoc>=15.0.0",
]

[tool.pdoc]
modules = [
  "neural_dynamics.core",
  "neural_dynamics.models",
  "neural_dynamics.training",
  "./config.py",
  "./main.py",
]
output_directory = "docs"
docformat = "google"
math = true
mermaid = true
search = true
show_source = false
include_undocumented = false
exclude = [
  "legacy",
]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Also include single-file modules at repo root
[tool.setuptools]
py-modules = ["config", "main"]

# Package discovery for installation/build
[tool.setuptools.packages.find]
include = [
  "neural_dynamics*",
  "examples*",
]
exclude = [
  "tests*",
  "docs*",
  "**/__pycache__*",
]

[tool.pytest.ini_options]
testpaths = ["neural_dynamics/tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]
markers = [
    "slow: long-running or heavyweight tests",
    "sanity: quick import and smoke checks",
]

[tool.coverage.run]
source = ["neural_dynamics"]
