# Pre-commit configuration for code quality and testing
# Ensures consistency and quality across the codebase

# Exclude legacy folder from all hooks
exclude: '^legacy/'

repos:
  # Ruff formatting and linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      # Lint code with ruff
      - id: ruff
        args: [--fix, --output-format, text]
        exclude: '^legacy/'

  # Local hooks for testing and type checking
  - repo: local
    hooks:
      # Type checking with Ty - only on staged files
      - id: ty
        name: Ty type checker
        entry: bash -c 'git diff --cached --name-only --diff-filter=ACM | grep "\.py$" | xargs -r uvx ty check --exclude legacy'
        language: system
        files: '\.py$' # Only run on Python files
        pass_filenames: false # We handle filenames manually
        exclude: '^legacy/'
      # Run tests only when test files are staged
      - id: pytest
        name: pytest (fast unit tests)
        entry: bash -c 'if git diff --cached --name-only --diff-filter=ACM | grep -q "^tests/.*\.py$"; then uv run pytest -q --ignore=legacy; fi'
        language: system
        files: '^tests/.*\.py$' # Only run on test files in tests/ directory
        pass_filenames: false # We handle the condition manually
        exclude: '^legacy/'
      
# Run hooks on both commit and push stages
default_stages: [pre-commit, pre-push]
