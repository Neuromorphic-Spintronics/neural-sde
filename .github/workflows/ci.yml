name: CI

on:
  pull_request:
    branches: [main, "*"]
  push:
    branches: [main, "*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Cache uv environment
        uses: actions/cache@v4
        with:
          path: |
            .venv
            uv.lock
          key: ${{ runner.os }}-uv-v2-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: |
          uv venv .venv
          uv sync

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check with ty
        run: uvx ty check

  tests-fast:
    runs-on: ubuntu-latest
    needs: [lint-type]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Cache uv environment
        uses: actions/cache@v4
        with:
          path: |
            .venv
            uv.lock
          key: ${{ runner.os }}-uv-v2-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: |
          uv venv .venv
          uv sync

      - name: Run fast tests (not slow)
        run: uv run pytest -m "not slow" -v

  tests-slow:
    runs-on: ubuntu-latest
    needs: [tests-fast]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Cache uv environment
        uses: actions/cache@v4
        with:
          path: |
            .venv
            uv.lock
          key: ${{ runner.os }}-uv-v2-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: |
          uv venv .venv
          uv sync

      - name: Run slow tests
        run: uv run pytest -m slow -v
