name: SRS Lean proof check

on:
  push:
    branches:
      - srs-lean-proof-check

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan and Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Resolve Mathlib
        run: lake update
      - name: Get Mathlib cache
        run: lake exe cache get
      - name: Type-check formal proof
        run: lake build
      - name: Reject sorry
        run: |
          if grep -R -n -E '(^|[^A-Za-z])(sorry|admit)([^A-Za-z]|$)' SRSProof.lean; then
            echo "Found unfinished proof"
            exit 1
          fi
